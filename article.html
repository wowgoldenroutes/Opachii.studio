<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article · Opachii Studio</title><link rel="stylesheet" href="assets/site.css"><style>.article{max-width:820px;margin:60px auto;padding:0 22px;line-height:1.8}.article h1{font-size:clamp(32px,5vw,55px);line-height:1.15}.article img{max-width:100%;height:auto;display:block;margin:25px auto}.article p{white-space:pre-wrap}.article .meta{opacity:.7}</style><header class="site-header"><a class="logo" href="/">OPACHII<span>.</span>STUDIO</a></header><main class="article" id="article"></main><script>const id=new URLSearchParams(location.search).get('id');fetch('data/articles.json',{cache:'no-store'}).then(r=>r.json()).then(a=>{let x=a.find(x=>x.id===id);if(!x)throw Error('Article not found');document.title=x.title+' · Opachii Studio';const el=document.getElementById('article');const add=(tag,t,cls)=>{let n=document.createElement(tag);n.textContent=t||'';if(cls)n.className=cls;el.append(n);return n};add('div',x.category+' · '+x.date,'meta');add('h1',x.title);for(const b of x.blocks||[]){if(b.type==='image'){const im=document.createElement('img');im.src=b.src;im.alt=b.alt||'';el.append(im)}else if(b.type==='heading')add('h2',b.text);else add('p',b.text)}}).catch(()=>{document.getElementById('article').textContent='Article not found.'})</script></html>
